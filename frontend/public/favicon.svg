<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- Background rounded square -->
  <rect width="32" height="32" rx="7" fill="url(#bg)"/>

  <!-- CloudSun icon (lucide-style), scaled to fit 32×32, centered -->
  <!-- Sun rays -->
  <g stroke="#fff" stroke-width="1.6" stroke-linecap="round">
    <line x1="10" y1="7"  x2="10" y2="5"/>
    <line x1="6.2" y1="9.2" x2="4.8" y2="7.8"/>
    <line x1="4.5" y1="13" x2="2.5" y2="13"/>
    <line x1="6.2" y1="16.8" x2="4.8" y2="18.2"/>
  </g>
  <!-- Sun circle -->
  <circle cx="10" cy="13" r="3" stroke="#fff" stroke-width="1.6"/>
  <!-- Cloud body -->
  <path d="M14 22H9a4 4 0 0 1-.5-7.96A6 6 0 0 1 20 16.5a3.5 3.5 0 0 1-.5 6.96L14 22z"
        fill="#fff" opacity="0.95"/>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
  </defs>
</svg>
